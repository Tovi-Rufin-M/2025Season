<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Season 2025</title>
</head>
<style>
    body {
        font-family: Arial, sans-serif;
        background: linear-gradient(#160a2c 0%, #36361d 75%, #57531c 100%);
        margin: 0;
        padding: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
    }

    /* INTRO STYLES */
    #intro {
        text-align: center;
        max-width: 800px;
        /* Ensures intro doesn't shift layout when hiding later */
        position: absolute; 
        width: 100%;
        color: white;
    }
    #container {
        width: 100%;
        height: 100%;
        gap: 20px;
        display: none; /* Hidden initially */
        opacity: 0; /* For fade-in effect */
        .item:nth-child(1) {
            flex-grow: 1;
        }
    }
    #text {
        background-color: black;
    }
    #memories {

    }

    /* MAIN CONTENT STYLES 
        (Moved from JS to CSS for cleaner code) */
    
    /* Utility class to trigger fade in */
    #container.visible {
        opacity: 1;
    }
</style>
<body>

    <div id="intro">
        <div id="fireworks"><!-- Fireworks animation can be added here --></div>
        <h1 id="text"></h1>
    </div>
    
    <div id="container">
        <div class="item" id="memories" style="width: 75%;">
            2 bruh
        </div>
        <div class="item" id="text" style="width: 25%;">
            3 bruh
        </div>
    </div>


    <script>
        const place = document.getElementById('text');
        const containerDiv = document.getElementById('container');
        const introDiv = document.getElementById('intro');
        const fireworksDiv = document.getElementById('fireworks');
        
        const textArray = [
            "and with that",
            "The 2025 season",
            "comes to an end",
            "goodnight."
        ];

        // FIX: Variable moved outside the function so it doesn't reset to 0
        let index = 0; 

        function showintro() {
            // BASE CASE: If we run out of text, switch to main
            if (index >= textArray.length) {
                container();
                return;
            }

            // 1. Change text
            place.innerHTML = textArray[index];

            // 2. Fade In
            place.style.opacity = 1;

            // 3. Wait for reading time (2s)
            setTimeout(() => {
                // 4. Fade Out
                place.style.opacity = 0;
                
                // 5. Wait for fade-out transition (1s), then next line
                setTimeout(() => {
                    index++;
                    showintro(); // Recursion
                }, 100); 

            }, 100);
        }
        function fireworkseffect() {
            //add fireworks effect here
        }

        function container() {
            // 1. Hide the intro container entirely
            introDiv.style.display = 'none';

            // 2. Prepare main div (display block first so browser renders it)
            containerDiv.style.display = 'flex';

            // 3. Small delay to ensure the browser processes 'display: block' 
            // before applying opacity, otherwise the transition won't fire.
            setTimeout(() => {
                containerDiv.classList.add('visible');
            }, 50);

        }


        // Start the sequence
        showintro();
        fireworkseffect();

    </script>
</body>
</html>
